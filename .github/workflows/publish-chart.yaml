name: Publish Helm chart

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, branch, or commit to package
        required: false
        type: string
      channel:
        description: Prerelease channel when no chart version is specified
        required: true
        default: develop
        type: choice
        options:
          - develop
          - temporary
      chart_version:
        description: Optional Helm chart version (for example, 1.14.1-develop.1)
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Check out chart source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Determine chart version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.chart_version }}
          CHANNEL: ${{ inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${TAG_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="0.0.0-${CHANNEL}.${RUN_NUMBER}+${SHORT_SHA:0:7}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate OCI chart name
        id: chart
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          chart_name="$(helm show chart . | awk -F ': ' '$1 == "name" { print $2 }')"
          if [[ -z "$chart_name" || "$chart_name" != "${chart_name,,}" ]]; then
            echo "Chart.yaml name must be lowercase to publish an OCI chart: ${chart_name:-<missing>}" >&2
            exit 1
          fi

          echo "name=$chart_name" >> "$GITHUB_OUTPUT"
          echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Lint and package chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          helm lint .
          helm package . --destination dist --version "$CHART_VERSION"

      - name: Log in to GitHub Container Registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          echo "${{ github.token }}" | \
            helm registry login "$REGISTRY" \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Push chart to GitHub Container Registry
        env:
          CHART: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${OWNER,,}"
          helm push \
            "dist/${CHART}-${CHART_VERSION}.tgz" \
            "oci://${REGISTRY}/${owner}"
