{{- $subnetIDs := required "ec2nodeclass.subnetIds is required" .Values.ec2nodeclass.subnetIds }}
{{- if not $subnetIDs }}
{{- fail "ec2nodeclass.subnetIds must contain at least one subnet ID" }}
{{- end }}
{{- $amiSelectorTerms := required "ec2nodeclass.amiSelectorTerms is required" .Values.ec2nodeclass.amiSelectorTerms }}
{{- if not $amiSelectorTerms }}
{{- fail "ec2nodeclass.amiSelectorTerms must contain at least one selector term" }}
{{- end }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ required "ec2nodeclass.name is required" .Values.ec2nodeclass.name }}
  labels:
    {{- include "karpenter-chart.labels" . | nindent 4 }}
    {{- if .Values.ec2nodeclass.labels }}
    {{- toYaml .Values.ec2nodeclass.labels | nindent 4 }}
    {{- end }}
spec:
  amiFamily: {{ .Values.ec2nodeclass.amiFamily }}
  role: {{ required "ec2nodeclass.role is required" .Values.ec2nodeclass.role }}
  subnetSelectorTerms:
    {{- range $subnetIDs }}
    - id: {{ . }}
    {{- end }}
  securityGroupSelectorTerms:
    - id: {{ required "ec2nodeclass.securityGroupId is required" .Values.ec2nodeclass.securityGroupId }}
  amiSelectorTerms:
    {{- toYaml $amiSelectorTerms | nindent 4 }}
  {{- if .Values.ec2nodeclass.metadataOptions }}
  metadataOptions:
    {{- toYaml .Values.ec2nodeclass.metadataOptions | nindent 4 }}
  {{- end }}
  {{- if .Values.ec2nodeclass.blockDeviceMappings }}
  blockDeviceMappings:
    {{- toYaml .Values.ec2nodeclass.blockDeviceMappings | nindent 4 }}
  {{- end }}
  {{- if .Values.ec2nodeclass.tags }}
  tags:
    {{- toYaml .Values.ec2nodeclass.tags | nindent 4 }}
  {{- end }}