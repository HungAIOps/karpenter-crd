{{- $arch := required "nodepool.arch is required" .Values.nodepool.arch }}
{{- if not $arch }}
{{- fail "nodepool.arch must contain at least one architecture" }}
{{- end }}
{{- $capacityType := required "nodepool.capacityType is required" .Values.nodepool.capacityType }}
{{- if not $capacityType }}
{{- fail "nodepool.capacityType must contain at least one capacity type" }}
{{- end }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ required "nodepool.name is required" .Values.nodepool.name }}
  labels:
    {{- include "karpenter-chart.labels" . | nindent 4 }}
    {{- if .Values.nodepool.labels }}
    {{- toYaml .Values.nodepool.labels | nindent 4 }}
    {{- end }}
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ required "ec2nodeclass.name is required" .Values.ec2nodeclass.name }}
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            {{- toYaml $arch | nindent 12 }}
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            {{- toYaml $capacityType | nindent 12 }}
        {{- if .Values.nodepool.instanceCategories }}
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            {{- toYaml .Values.nodepool.instanceCategories | nindent 12 }}
        {{- end }}
  {{- with .Values.nodepool.limits }}
  limits:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodepool.disruption }}
  disruption:
    {{- toYaml . | nindent 4 }}
  {{- end }}